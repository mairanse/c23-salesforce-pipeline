<template>
    <section class="slds-box">
        <div class="slds-grid slds-wrap slds-gutters_small">
            <div class="slds-col slds-size_1-of-1 slds-large-size_8-of-12">
                <lightning-input type="search" label="Search Knowledge" value={query} onchange={handleQueryChange}></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-large-size_4-of-12">
                <lightning-combobox label="Category" value={categoryFilter} options={facetOptions} onchange={handleFacetChange}></lightning-combobox>
            </div>
        </div>

        <template lwc:if={errorMessage}>
            <div class="slds-m-top_small slds-text-color_error">{errorMessage}</div>
        </template>

        <template lwc:if={isLoading}>
            <div class="slds-m-top_medium"><lightning-spinner size="small"></lightning-spinner></div>
        </template>

        <div class="slds-grid slds-wrap slds-gutters_medium slds-m-top_medium">
            <div class="slds-col slds-size_1-of-1 slds-large-size_5-of-12">
                <h3 class="slds-text-title_caps">Articles</h3>
                <template lwc:if={hasItems}>
                    <ul class="slds-has-dividers_bottom-space">
                        <template for:each={items} for:item="item">
                            <li key={item.id} class="slds-item slds-p-vertical_x-small">
                                <button class="slds-button slds-button_reset" data-id={item.id} onclick={handleSelectArticle}>
                                    <strong>{item.title}</strong>
                                </button>
                                <div class="slds-text-color_weak slds-text-body_small">{item.summary}</div>
                            </li>
                        </template>
                    </ul>
                </template>
            </div>

            <div class="slds-col slds-size_1-of-1 slds-large-size_7-of-12">
                <template lwc:if={hasSelectedArticle}>
                    <article class="slds-box slds-theme_default">
                        <h3 class="slds-text-heading_small">{selectedArticle.title}</h3>
                        <p class="slds-m-top_x-small">{selectedArticle.summary}</p>
                    </article>
                    <article class="slds-box slds-theme_shade slds-m-top_small">
                        <h4 class="slds-text-title_bold">AI Summary</h4>
                        <p class="slds-m-top_x-small">{aiSummary}</p>
                    </article>
                </template>
            </div>
        </div>
    </section>
</template>
