<template>
    <lightning-card title="User Permission Summary">
        <div class="slds-p-around_medium">
            <c-c23-user-lookup onuserselected={handleUserSelected}></c-c23-user-lookup>
        </div>

        <template if:true={selectedUser}>
            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                <div class="slds-box slds-theme_default">
                    <h2 class="slds-text-heading_small slds-m-bottom_small">Selected User</h2>
                    <dl class="slds-list_horizontal slds-wrap">
                        <dt class="slds-item_label slds-truncate slds-text-color_weak" title="Name">Name:</dt>
                        <dd class="slds-item_detail slds-truncate slds-m-bottom_x-small">{selectedUser.name}</dd>

                        <dt class="slds-item_label slds-truncate slds-text-color_weak" title="Username">Username:</dt>
                        <dd class="slds-item_detail slds-truncate slds-m-bottom_x-small">{selectedUser.username}</dd>

                        <dt class="slds-item_label slds-truncate slds-text-color_weak" title="Email">Email:</dt>
                        <dd class="slds-item_detail slds-truncate slds-m-bottom_x-small">{selectedUser.email}</dd>

                        <dt class="slds-item_label slds-truncate slds-text-color_weak" title="Active">Active:</dt>
                        <dd class="slds-item_detail slds-truncate slds-m-bottom_x-small">{activeLabel}</dd>

                        <dt class="slds-item_label slds-truncate slds-text-color_weak" title="Profile">Profile:</dt>
                        <dd class="slds-item_detail slds-truncate">{selectedUser.profileName}</dd>
                    </dl>
                </div>
            </div>

            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                <template if:true={isLoadingAssignments}>
                    <lightning-spinner alternative-text="Loading assignment summary" size="small"></lightning-spinner>
                </template>

                <template if:true={assignmentError}>
                    <div class="slds-text-color_error slds-m-bottom_small">{assignmentError}</div>
                </template>

                <template if:true={hasAssignmentSections}>
                    <lightning-accordion allow-multiple-sections-open active-section-name={openSectionNames}>
                        <template for:each={assignmentSections} for:item="section">
                            <lightning-accordion-section key={section.name} name={section.name} label={section.title}>
                                <template if:true={section.hasItems}>
                                    <ul class="slds-list_dotted slds-p-left_medium">
                                        <template for:each={section.items} for:item="item">
                                            <li key={item.id}>{item.name}</li>
                                        </template>
                                    </ul>
                                </template>
                                <template if:false={section.hasItems}>
                                    <div class="slds-text-color_weak">{section.emptyMessage}</div>
                                </template>
                            </lightning-accordion-section>
                        </template>
                    </lightning-accordion>
                </template>
            </div>
        </template>
    </lightning-card>
</template>
