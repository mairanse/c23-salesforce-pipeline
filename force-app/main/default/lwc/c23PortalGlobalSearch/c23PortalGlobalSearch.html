<template>
    <section class="slds-box">
        <div class="slds-grid slds-wrap slds-gutters_small">
            <div class="slds-col slds-size_1-of-1 slds-large-size_8-of-12">
                <lightning-input type="search" label="Search Portal" value={query} onchange={handleQueryChange}></lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-large-size_4-of-12">
                <lightning-combobox label="Object" value={objectFilter} options={objectFilterOptions} onchange={handleObjectFilterChange}></lightning-combobox>
            </div>
        </div>

        <template lwc:if={isLoading}>
            <div class="slds-m-top_medium"><lightning-spinner size="small"></lightning-spinner></div>
        </template>

        <template lwc:if={errorMessage}>
            <div class="slds-m-top_medium slds-text-color_error">{errorMessage}</div>
        </template>

        <template lwc:if={showEmpty}>
            <div class="slds-m-top_medium slds-text-color_weak">No results found.</div>
        </template>

        <template lwc:if={hasResults}>
            <div class="slds-m-top_medium">
                <template for:each={groups} for:item="group">
                    <article key={group.key} class="slds-box slds-m-bottom_small">
                        <h3 class="slds-text-heading_small">{group.label} {group.countLabel}</h3>
                        <ul class="slds-list_dotted slds-m-top_x-small">
                            <template for:each={group.items} for:item="item">
                                <li key={item.id}>
                                    <strong>{item.title}</strong>
                                    <template lwc:if={item.subtitle}> — {item.subtitle}</template>
                                    <template lwc:if={item.detail}> ({item.detail})</template>
                                </li>
                            </template>
                        </ul>
                    </article>
                </template>
            </div>
        </template>
    </section>
</template>
